# 이 파일은 저장소의  .github/workflows/research.yml  경로에 두세요.

name: Sotos Research Agent

on:
  schedule:
    # UTC 21:00 = 한국시간(KST) 06:00. 매일 자동 실행. (혼잡 시 10~30분 지연 가능)
    - cron: "0 21 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 + 모드 선택
    inputs:
      mode:
        description: "실행 모드 선택"
        type: choice
        default: normal
        options:
          - normal      # 평소: 최근 신규만 분석·갱신
          - retag       # 일회성: 기존 전체에 주제 꼬리표 달기
          - backfill    # 일회성: 과거 20년치 전체 분석

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 에이전트 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "retag" ]; then
            python sotos_research_agent.py --retag
          elif [ "$MODE" = "backfill" ]; then
            python sotos_research_agent.py --backfill
          else
            python sotos_research_agent.py
          fi

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "연구 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
